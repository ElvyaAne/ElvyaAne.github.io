name: Refresh LeetCode stats

on:
  schedule:
    - cron: '17 * * * *'   # hourly; only commits when the numbers change
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/leetcode.mjs
      - name: Commit if changed
        run: |
          git diff --quiet data/leetcode.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json
          git commit -m "Update LeetCode stats"
          git push
